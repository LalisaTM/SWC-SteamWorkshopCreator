[package]
name = "steam-workshop-creator"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native Steam showcase splitter and GIF exporter"
repository = "https://github.com/LalisaTM/SWC-SteamWorkshopCreator"

[features]
console = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
self-replace = "1.5"
sha2 = "0.10"

[build-dependencies]
embed-resource = "3"
sha2 = "0.10"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
zip = { version = "4.6", default-features = false, features = ["deflate"] }

