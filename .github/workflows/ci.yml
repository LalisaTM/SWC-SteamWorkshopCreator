name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: vendor/ffmpeg
          key: ffmpeg-9.0.2-60f467265b1e
      - name: FFmpeg-Build und Testmedien vorbereiten
        shell: pwsh
        run: |
          ./scripts/prepare-ffmpeg.ps1
          Expand-Archive vendor/ffmpeg/ffmpeg-9.0.2-essentials_build.zip target/ffmpeg-test -Force
          Add-Content $env:GITHUB_PATH "$pwd/target/ffmpeg-test/ffmpeg-9.0.2-essentials_build/bin"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo check --locked --features console
